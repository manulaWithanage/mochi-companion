name: Promote published release

# Fires when a draft is published, however it was published — the web UI, the
# CLI, or the API. The release workflow cannot do this itself: a draft has no
# "latest" to be, and the moment that matters is the one a human chooses.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  promote:
    name: Point "latest" at it
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The trap this closes: publishing a draft does not move GitHub's "latest"
      # pointer once a previous release has been pinned. On 2026-08-05 v0.1.3 was
      # published and v0.1.2 stayed latest, so
      # releases/latest/download/Mochi-Setup.exe — the website's download link and
      # the URL the updater resolves — kept serving the old installer. The release
      # page looked right and every download was the previous version.
      - name: Decide and promote
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
          RELEASE_ID: ${{ github.event.release.id }}
        shell: bash
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>/dev/null || echo "")
          echo "published: $TAG (prerelease=$IS_PRERELEASE)"
          echo "current latest: ${current:-none}"

          set +e
          node scripts/promote-release.mjs "$TAG" "$IS_PRERELEASE" "$current"
          decision=$?
          set -e

          # 3 means "deliberately not promoting" — a prerelease, or an older
          # release being re-published. That is an expected outcome, not a
          # failure, and failing here would train everyone to ignore this job.
          if [ "$decision" = "3" ]; then
            echo "Leaving \"latest\" where it is."
            exit 0
          fi
          if [ "$decision" != "0" ]; then
            echo "::error::promote-release.mjs exited $decision"
            exit 1
          fi

          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -F make_latest=true --jq '.tag_name' > /dev/null

          # Asserted, not assumed. The PATCH returning 200 is not the same as the
          # pointer having moved, and the whole point of this job is that a
          # pointer left behind looks exactly like success.
          sleep 3
          now=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          echo "latest is now: $now"
          if [ "$now" != "$TAG" ]; then
            echo "::error::Expected \"latest\" to be $TAG, it is $now. The website download link and the auto-updater both resolve through this pointer, so they would keep serving the previous release."
            exit 1
          fi
