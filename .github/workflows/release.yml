name: Release

# Tag pushes only. `git tag v1.0.1 && git push origin v1.0.1`.
on:
  push:
    tags: ['v*']

# Never cancel a half-finished release. The default would let a second tag kill a
# run that had already built an installer, leaving an unclear result behind.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Read-only by default. `contents: write` is granted to the installer job alone,
# not to the whole workflow, so the gates can never write to the repository.
permissions:
  contents: read

jobs:
  # Two seconds, and it runs before anything is installed or built. Discovering a
  # version mismatch after a ten-minute Windows build is a worse day, and the
  # script has no dependencies precisely so it can go first.
  version:
    name: Tag matches the manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag against apps/desktop/package.json
        run: node scripts/release-version.mjs "$GITHUB_REF"

  # The same five gates main is held to, on all three platforms — not a second
  # copy of them. `needs: version` means an obviously wrong tag does not spend
  # fifteen minutes of runner time proving the code is fine.
  gates:
    name: Gates
    needs: version
    uses: ./.github/workflows/ci.yml

  installer:
    name: Windows installer
    needs: gates
    runs-on: windows-latest
    # Scoped here rather than at workflow level: only this job creates a release.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v4
        with:
          # Same pin as ci.yml. A release built on a different Node than the one
          # the gates ran under is a release nothing actually verified.
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build the renderer and main bundles
        run: pnpm --filter @mochi/desktop build

      # Created up front, deliberately.
      #
      # electron-builder's GitHub publisher uploads each artifact separately and
      # creates the draft release on demand. With nothing there to find, two
      # concurrent uploads both created one: observed on v0.1.1, which produced
      # two drafts in the same second — latest.yml and the installer in one, the
      # blockmap alone in the other. Neither was complete, and the blockmap is
      # what lets electron-updater download only the changed blocks.
      #
      # The publisher reuses an existing draft for the tag, so creating it here
      # removes the race.
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          # Already there on a re-run, and that is success rather than failure.
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" --generate-notes
          fi
          gh release view "$GITHUB_REF_NAME" --json isDraft,tagName

      # Uploads into the draft above. Nothing is offered to anyone until that
      # draft is published by hand — the review step that makes an automatic
      # pipeline safe to leave running, since a bad latest.yml is far harder to
      # undo than a bad build.
      - name: Package and publish the installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm --filter @mochi/desktop exec electron-builder --win --publish always

      # Asserted explicitly, because the upload glob will not catch it.
      # `if-no-files-found: error` only fires when *no* pattern matches, so when
      # this file was missing from the first tagged build two of three patterns
      # matched and the step passed green. latest.yml is the one file
      # electron-updater reads; without it there is no auto-update at all, and
      # nothing would have said so.
      - name: Verify latest.yml was generated
        shell: bash
        run: |
          if [ ! -f apps/desktop/release/latest.yml ]; then
            echo "::error::latest.yml was not generated. electron-updater has nothing to read, so no user would ever be offered this update. Check the publish block in apps/desktop/electron-builder.yml."
            ls -la apps/desktop/release
            exit 1
          fi
          echo "latest.yml:"
          cat apps/desktop/release/latest.yml

      # The v0.1.1 failure was two drafts for one tag, and nothing complained.
      - name: Verify exactly one release exists for this tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          count=$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq "[.[] | select(.tag_name == \"$GITHUB_REF_NAME\")] | length")
          echo "releases for $GITHUB_REF_NAME: $count"
          if [ "$count" != "1" ]; then
            echo "::error::Expected exactly one release for $GITHUB_REF_NAME, found $count. Artifacts are split across releases, so the published one would be missing files."
            exit 1
          fi
          gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[] | "  \(.name)"'

      # Kept alongside the draft release. The run artifact outlives a deleted
      # draft, which is the difference between "rebuild it" and "re-tag it".
      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: mochi-windows-${{ github.ref_name }}
          # latest.yml and the blockmap are what the auto-updater reads. They are
          # kept here so Phase 3 can be checked against a real build rather than
          # against an assumption about what electron-builder emits.
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest.yml
          if-no-files-found: error
          retention-days: 14
