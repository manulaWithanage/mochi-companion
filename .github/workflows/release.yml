name: Release

# Normally a tag push: `git tag v1.0.1 && git push origin v1.0.1`.
#
# `workflow_dispatch` is the hand crank, and it exists because the tag push is
# not guaranteed to arrive. On 2026-08-06 GitHub Actions spent six hours
# throttling webhook delivery to about 15% "so many events such as pushes and
# pull requests are not triggering workflow runs" — v0.2.6 was tagged three
# times and never produced a single run. Deleting and re-pushing a tag was the
# only lever, and it is a lottery ticket rather than a lever.
#
# Dispatch it against the tag, not a branch:
#
#     gh workflow run release.yml --ref v1.0.1
#
# `github.ref_name` is then the tag, so the version check, the draft and the
# publish all behave exactly as they do on a push. A REST call also takes a
# different path from a webhook, which is what makes this useful while
# deliveries are being dropped.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Never cancel a half-finished release. The default would let a second tag kill a
# run that had already built an installer, leaving an unclear result behind.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Read-only by default. `contents: write` is granted to the installer job alone,
# not to the whole workflow, so the gates can never write to the repository.
permissions:
  contents: read

jobs:
  # Two seconds, and it runs before anything is installed or built. Discovering a
  # version mismatch after a ten-minute Windows build is a worse day, and the
  # script has no dependencies precisely so it can go first.
  version:
    name: Tag matches the manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag against apps/desktop/package.json
        run: node scripts/release-version.mjs "$GITHUB_REF"

  # The same five gates main is held to, on all three platforms — not a second
  # copy of them. `needs: version` means an obviously wrong tag does not spend
  # fifteen minutes of runner time proving the code is fine.
  gates:
    name: Gates
    needs: version
    uses: ./.github/workflows/ci.yml

  # Extracted from the installer job the moment a second platform appeared.
  #
  # It used to live inside the Windows job, which was fine while that was the
  # only builder. Two builders both creating the draft on demand is exactly the
  # race that produced two releases for v0.1.1 — artifacts split across them,
  # neither complete. One job, before either builder starts, removes it again.
  draft:
    name: Draft release
    needs: gates
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Already there on a re-run, and that is success rather than failure.
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" --generate-notes
          fi
          gh release view "$GITHUB_REF_NAME" --json isDraft,tagName

  installer:
    name: Windows installer
    needs: draft
    runs-on: windows-latest
    # Scoped here rather than at workflow level: only release jobs need it.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v7
        with:
          # Same pin as ci.yml. A release built on a different Node than the one
          # the gates ran under is a release nothing actually verified.
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build the renderer and main bundles
        run: pnpm --filter @mochi/desktop build

      # Uploads into the draft created by the `draft` job. Nothing is offered to anyone until that
      # draft is published by hand — the review step that makes an automatic
      # pipeline safe to leave running, since a bad latest.yml is far harder to
      # undo than a bad build.
      - name: Package and publish the installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm --filter @mochi/desktop exec electron-builder --win --publish always

      # Asserted explicitly, because the upload glob will not catch it.
      # `if-no-files-found: error` only fires when *no* pattern matches, so when
      # this file was missing from the first tagged build two of three patterns
      # matched and the step passed green. latest.yml is the one file
      # electron-updater reads; without it there is no auto-update at all, and
      # nothing would have said so.
      - name: Verify latest.yml was generated
        shell: bash
        run: |
          if [ ! -f apps/desktop/release/latest.yml ]; then
            echo "::error::latest.yml was not generated. electron-updater has nothing to read, so no user would ever be offered this update. Check the publish block in apps/desktop/electron-builder.yml."
            ls -la apps/desktop/release
            exit 1
          fi
          echo "latest.yml:"
          cat apps/desktop/release/latest.yml

      # The v0.1.1 failure was two drafts for one tag, and nothing complained.
      - name: Verify exactly one release exists for this tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          count=$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq "[.[] | select(.tag_name == \"$GITHUB_REF_NAME\")] | length")
          echo "releases for $GITHUB_REF_NAME: $count"
          if [ "$count" != "1" ]; then
            echo "::error::Expected exactly one release for $GITHUB_REF_NAME, found $count. Artifacts are split across releases, so the published one would be missing files."
            exit 1
          fi
          gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[] | "  \(.name)"'

      # Kept alongside the draft release. The run artifact outlives a deleted
      # draft, which is the difference between "rebuild it" and "re-tag it".
      - name: Upload the installer
        uses: actions/upload-artifact@v7
        with:
          name: mochi-windows-${{ github.ref_name }}
          # latest.yml and the blockmap are what the auto-updater reads. They are
          # kept here so Phase 3 can be checked against a real build rather than
          # against an assumption about what electron-builder emits.
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest.yml
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------------
  # macOS
  # ---------------------------------------------------------------------------
  #
  # Runs in parallel with the Windows job — both upload into the draft the
  # `draft` job already created, so neither races to make one.
  #
  # **The disk image is not signed and not notarised.** Gatekeeper refuses an
  # unsigned app downloaded from the internet, so this is a build somebody can
  # run only by clearing the quarantine attribute by hand. Worse for updates:
  # electron-updater delegates to Squirrel.Mac, which validates the bundle's
  # code signature before swapping it in, so an unsigned macOS build cannot
  # update itself at all — where the unsigned Windows build merely warns.
  #
  # The job exists so the build is real and reproducible while a certificate is
  # pending. Do not link it from the website as an equal to the Windows
  # download until it is signed.
  mac:
    name: macOS disk image
    needs: draft
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build the renderer and main bundles
        run: pnpm --filter @mochi/desktop build

      - name: Package and publish the disk image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Without this electron-builder hunts the keychain for a signing
          # identity, and on a runner that has none it either fails outright or
          # signs ad-hoc and pretends it worked. Saying "there is no identity"
          # is the honest version, and it keeps the failure at build time rather
          # than on a stranger's Mac.
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: pnpm --filter @mochi/desktop exec electron-builder --mac --publish always

      # The macOS feed is a different file from the Windows one, and asserting
      # the wrong name would pass green while auto-update had nothing to read —
      # the failure this check exists to catch, one platform over.
      - name: Verify latest-mac.yml was generated
        run: |
          if [ ! -f apps/desktop/release/latest-mac.yml ]; then
            echo "::error::latest-mac.yml was not generated. electron-updater has nothing to read on macOS."
            ls -la apps/desktop/release
            exit 1
          fi
          echo "latest-mac.yml:"
          cat apps/desktop/release/latest-mac.yml

      - name: Upload the disk image
        uses: actions/upload-artifact@v7
        with:
          name: mochi-macos-${{ github.ref_name }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest-mac.yml
          if-no-files-found: error
          retention-days: 14
