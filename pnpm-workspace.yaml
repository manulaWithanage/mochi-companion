packages:
  - 'apps/*'
  - 'packages/*'

# pnpm blocks dependency build scripts by default. These three need theirs:
#   electron         downloads the platform binary in postinstall
#   better-sqlite3   compiles the native addon
#   esbuild          fetches its platform binary
allowBuilds:
  electron: true
  better-sqlite3: true
  esbuild: true
