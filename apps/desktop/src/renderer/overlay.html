<!doctype html>
<html
  lang="en"
  style="background: transparent !important; background-color: rgba(0, 0, 0, 0) !important"
>
  <head>
    <meta charset="UTF-8" />
    <!--
      No remote anything. The renderer displays LLM output and (in V2) email
      content, so the CSP is locked down before there is anything to exploit.
      img-src allows data: because sprite sheets cross the bridge as data URLs.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;"
    />
    <title>Mochi</title>
    <style>
      html,
      body,
      #root {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent !important;
        background-color: rgba(0, 0, 0, 0) !important;
        /* The window is mascot-sized and click-through; nothing here should
           ever show a text cursor or be selectable. */
        user-select: none;
        cursor: default;
      }
      /* The petting wiggle. On a wrapper around the mascot canvas, because the
         canvas's inline transform belongs to the pose system. */
      @keyframes mochi-delight {
        0% {
          transform: rotate(0deg) scale(1);
        }
        20% {
          transform: rotate(-5deg) scale(1.04);
        }
        45% {
          transform: rotate(4deg) scale(1.05);
        }
        70% {
          transform: rotate(-3deg) scale(1.02);
        }
        100% {
          transform: rotate(0deg) scale(1);
        }
      }
    </style>
  </head>
  <body style="background: transparent !important; background-color: rgba(0, 0, 0, 0) !important">
    <div
      id="root"
      style="background: transparent !important; background-color: rgba(0, 0, 0, 0) !important"
    ></div>
    <script type="module" src="./src/overlay/main.tsx"></script>
  </body>
</html>
