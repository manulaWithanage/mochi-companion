# Packaging configuration.
#
# ---------------------------------------------------------------------------
# TWO NAMES, ON PURPOSE. Do not "tidy" them into one.
# ---------------------------------------------------------------------------
#
#   productName here (electron-builder.yml)  -> build-time only.
#     Names the executable, the installer, the install directory and the
#     Windows file metadata. Safe to change: nothing the running app reads
#     depends on it.
#
#   productName in package.json              -> RUNTIME. LOAD-BEARING.
#     Electron derives app.getName() from it, and app.getPath('userData')
#     derives from that. Changing it silently relocates the database, the
#     settings file, and the encrypted key/Gmail/Google vaults. It has
#     already split this app's history across two folders once, and the only
#     symptom was a migration that looked like it had never run.
#
# So the shipped binary is MochiTheCompanion.exe while the data stays in
# %APPDATA%/Mochi. That asymmetry is deliberate. The `[paths]` line logged at
# startup prints both, so any drift shows up immediately.

appId: dev.mochi.companion
productName: MochiTheCompanion
copyright: Copyright (c) 2026 Manula Withanage

directories:
  output: release
  buildResources: assets

# Everything is bundled by electron-vite, so only the build output and the
# manifest need to ship. No native modules, so no rebuild step either.
files:
  - out/**/*
  - package.json
  - '!**/*.map'

npmRebuild: false

# skin-loader reads process.resourcesPath/skins when packaged. Without this the
# app installs fine and then cannot draw the mascot.
extraResources:
  - from: ../../skins
    to: skins
    filter:
      - '**/*'
      - '!**/*.md'

# One naming scheme for every platform, so a releases page sorts predictably
# and nobody has to guess which file is for which machine.
artifactName: ${productName}-${version}-${os}-${arch}.${ext}

# ---------------------------------------------------------------------------
# Windows
# ---------------------------------------------------------------------------
forceCodeSigning: false

# ---------------------------------------------------------------------------
# Publishing
# ---------------------------------------------------------------------------
# This block is not only about uploading. **It is what makes electron-builder
# emit latest.yml at all** — the one file electron-updater reads to learn a newer
# version exists. Verified the hard way on 2026-08-05: a tagged CI build with no
# publish provider produced the installer and its blockmap and no latest.yml, so
# auto-update would have been impossible no matter what the app-side code did.
publish:
  - provider: github
    owner: manulaWithanage
    repo: mochi-companion
    # Releases are created as drafts so a build can be looked at before anyone is
    # offered it. Publishing the draft is what actually starts the rollout.
    releaseType: draft

win:
  target:
    - target: nsis
      arch: [x64]
  icon: assets/icon.png
  # Stated explicitly rather than inherited from productName. This is the one
  # line that decides the .exe filename; leaving it implicit is how a rename
  # ends up quietly touching things it should not.
  executableName: MochiTheCompanion
  # No signing configured. Windows SmartScreen will warn on first run until
  # an OV/EV certificate is purchased and wired in here.

nsis:
  # A wizard rather than a silent one-click install: users installing an
  # unsigned app deserve to see what is happening and choose the location.
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  # What a human sees in the Start Menu. Not a filename, so spaces are fine
  # and the short name is friendlier.
  shortcutName: Mochi
  uninstallDisplayName: Mochi ${version}
  # Versionless on purpose. The website links to
  # releases/latest/download/Mochi-Setup.exe, and that endpoint needs an exact,
  # unchanging filename — a versioned one makes the download button 404 on every
  # release. The version is still in latest.yml, the installer's file properties
  # and the app itself, so nothing is lost but the guesswork.
  artifactName: Mochi-Setup.${ext}

# ---------------------------------------------------------------------------
# macOS
# ---------------------------------------------------------------------------
mac:
  target:
    - target: dmg
      arch: [arm64, x64]
  icon: assets/icon.png
  category: public.app-category.productivity

# ---------------------------------------------------------------------------
# Linux
# ---------------------------------------------------------------------------
linux:
  target:
    - AppImage
  icon: assets/icon.png
  category: Utility
  # Lowercase: this becomes the binary name on PATH and in the .desktop entry.
  executableName: mochithecompanion
