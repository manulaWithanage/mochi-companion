# Packaging configuration.
#
# ---------------------------------------------------------------------------
# TWO NAMES, ON PURPOSE. Do not "tidy" them into one.
# ---------------------------------------------------------------------------
#
#   productName here (electron-builder.yml)  -> build-time only.
#     Names the executable, the installer, the install directory and the
#     Windows file metadata. Safe to change: nothing the running app reads
#     depends on it.
#
#   productName in package.json              -> RUNTIME. LOAD-BEARING.
#     Electron derives app.getName() from it, and app.getPath('userData')
#     derives from that. Changing it silently relocates the database, the
#     settings file, and the encrypted key/Gmail/Google vaults. It has
#     already split this app's history across two folders once, and the only
#     symptom was a migration that looked like it had never run.
#
# So the shipped binary is MochiTheCompanion.exe while the data stays in
# %APPDATA%/Mochi. That asymmetry is deliberate. The `[paths]` line logged at
# startup prints both, so any drift shows up immediately.

appId: dev.mochi.companion
productName: MochiTheCompanion
copyright: Copyright (c) 2026 Manula Withanage

directories:
  output: release
  buildResources: assets

# Everything is bundled by electron-vite, so only the build output and the
# manifest need to ship. No native modules, so no rebuild step either.
files:
  - out/**/*
  - package.json
  - '!**/*.map'

npmRebuild: false

# ---------------------------------------------------------------------------
# Electron fuses
# ---------------------------------------------------------------------------
# Fuses are bits flipped in the Electron binary at package time. Runtime code
# cannot turn them back on, which is the point: each one closes a way to make
# MochiTheCompanion.exe run code that is not ours using nothing more than an
# environment variable, a command-line flag or a dropped-in folder. Decided
# 2026-09-26. Option names checked against app-builder-lib 26.15.3's
# FuseOptionsV1 (out/configuration.d.ts and scheme.json); the schema rejects
# unknown keys, so a typo fails the build instead of silently doing nothing.
#
# Conflict checks made before turning these on:
#   - asar is on: `asar` is not set here, and electron-builder defaults it to
#     true. There are no asarUnpack entries, so all app code is in app.asar.
#   - Nothing loads *code* from outside app.asar. resources/skins (extraResources)
#     is read by skin-loader as JSON and PNG data, never required or imported,
#     so onlyLoadAppFromAsar does not touch it. The only child process the app
#     starts is powershell.exe (activity-sampler), not a forked Electron.
#   - electron-updater 6.8.9 never sets or reads ELECTRON_RUN_AS_NODE (grepped
#     its out/ for RUN_AS_NODE: no matches). The NSIS updater spawns the
#     downloaded installer, or elevate.exe, directly — not process.execPath.
#   - Embedded asar integrity on Windows needs Electron >= 30 (we ship 43).
#     electron-builder hashes app.asar and writes the hash into the exe's
#     resources itself, after app.asar is final, so the two cannot disagree.
electronFuses:
  # ELECTRON_RUN_AS_NODE=1 turns the app into a plain Node.js runtime that will
  # execute any script it is handed. Also disables process.fork from the main
  # process, which nothing here uses.
  runAsNode: false
  # Chromium's cookie store is plaintext SQLite by default. One-way: once on,
  # turning it off again leaves the existing store unreadable.
  enableCookieEncryption: true
  # NODE_OPTIONS (e.g. --require=evil.js) and NODE_EXTRA_CA_CERTS would let an
  # environment variable inject code, or trust a MITM certificate for every
  # LLM and Gmail request the main process makes.
  enableNodeOptionsEnvironmentVariable: false
  # --inspect / --inspect-brk / SIGUSR1 open a debugger on the main process,
  # which is where API keys and OAuth tokens are decrypted.
  enableNodeCliInspectArguments: false
  # Refuse to start if app.asar has been edited after packaging...
  enableEmbeddedAsarIntegrityValidation: true
  # ...and refuse to look for app code anywhere else. Without this a loose
  # resources/app folder is tried when app.asar is missing, so integrity
  # validation is bypassed by deleting app.asar and dropping in a folder.
  onlyLoadAppFromAsar: true
  # Left at their defaults on purpose:
  #   loadBrowserProcessSpecificV8Snapshot — only matters with a custom
  #     snapshot, which we do not build.
  #   grantFileProtocolExtraPrivileges — both windows are loaded with loadFile
  #     from file://, and the Vite bundles are ES module scripts fetched over
  #     file://. Turning the extra privileges off without first moving to a
  #     custom protocol risks a blank window. Revisit alongside such a move.

# skin-loader reads process.resourcesPath/skins when packaged. Without this the
# app installs fine and then cannot draw the mascot.
extraResources:
  - from: ../../skins
    to: skins
    filter:
      - '**/*'
      - '!**/*.md'

# One naming scheme for every platform, so a releases page sorts predictably
# and nobody has to guess which file is for which machine.
artifactName: ${productName}-${version}-${os}-${arch}.${ext}

# ---------------------------------------------------------------------------
# Windows
# ---------------------------------------------------------------------------
forceCodeSigning: false

# ---------------------------------------------------------------------------
# Publishing
# ---------------------------------------------------------------------------
# This block is not only about uploading. **It is what makes electron-builder
# emit latest.yml at all** — the one file electron-updater reads to learn a newer
# version exists. Verified the hard way on 2026-08-05: a tagged CI build with no
# publish provider produced the installer and its blockmap and no latest.yml, so
# auto-update would have been impossible no matter what the app-side code did.
publish:
  - provider: github
    owner: manulaWithanage
    repo: mochi-companion
    # Releases are created as drafts so a build can be looked at before anyone is
    # offered it. Publishing the draft is what actually starts the rollout.
    releaseType: draft

win:
  target:
    - target: nsis
      arch: [x64]
  icon: assets/icon.png
  # Stated explicitly rather than inherited from productName. This is the one
  # line that decides the .exe filename; leaving it implicit is how a rename
  # ends up quietly touching things it should not.
  executableName: MochiTheCompanion
  # No signing configured. Windows SmartScreen will warn on first run until
  # an OV/EV certificate is purchased and wired in here.

nsis:
  # A wizard rather than a silent one-click install: users installing an
  # unsigned app deserve to see what is happening and choose the location.
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  # What a human sees in the Start Menu. Not a filename, so spaces are fine
  # and the short name is friendlier.
  shortcutName: Mochi
  uninstallDisplayName: Mochi ${version}
  # Versionless on purpose. The website links to
  # releases/latest/download/Mochi-Setup.exe, and that endpoint needs an exact,
  # unchanging filename — a versioned one makes the download button 404 on every
  # release. The version is still in latest.yml, the installer's file properties
  # and the app itself, so nothing is lost but the guesswork.
  artifactName: Mochi-Setup.${ext}

# ---------------------------------------------------------------------------
# macOS
# ---------------------------------------------------------------------------
mac:
  target:
    - target: dmg
      arch: [arm64, x64]
  icon: assets/icon.png
  category: public.app-category.productivity
  # Versionless, for the same reason the NSIS installer is: a stable filename is
  # what makes `releases/latest/download/<name>` resolve, and a versioned one
  # 404s the download button on every release. The arch stays in the name
  # because there genuinely are two files — an Apple Silicon Mac and an Intel
  # Mac need different ones, and guessing on the user's behalf is how somebody
  # ends up with a build that will not launch.
  artifactName: Mochi-${arch}.${ext}
  # Not signed and not notarised yet. Gatekeeper refuses an unsigned app from
  # the internet, and Squirrel.Mac validates the signature before applying an
  # update, so auto-update does not work on macOS until a certificate exists.
  # `hardenedRuntime` and an entitlements file belong here at that point.
  identity: null

# ---------------------------------------------------------------------------
# Linux
# ---------------------------------------------------------------------------
linux:
  target:
    - AppImage
  icon: assets/icon.png
  category: Utility
  # Lowercase: this becomes the binary name on PATH and in the .desktop entry.
  executableName: mochithecompanion
